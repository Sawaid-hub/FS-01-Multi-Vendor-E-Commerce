services:
  - type: web
    name: market-lane-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SEARCH_PROVIDER
        value: elastic
      - key: ELASTICSEARCH_URL
        value: https://582e91730ff348d48ae53bcb483f2de0.us-central1.gcp.cloud.es.io:443
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: market-lane-products
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_MODE
        value: api
      - key: EMAIL_DELIVERY_URL
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: CLIENT_BASE_URL
        fromService:
          type: web
          name: market-lane-client
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: market-lane-client
          envVarKey: RENDER_EXTERNAL_URL
      # Redis TLS: set to 0 only if your Redis provider uses self-signed certs (e.g. Upstash free).
      # Leave blank to enforce certificate verification (strongly recommended).
      - key: REDIS_TLS_REJECT_UNAUTHORIZED
        value: ''
      - key: STRIPE_TAX_ENABLED
        value: 'false'
      - key: COMMISSION_BPS
        value: '1000'
      - key: FX_API_URL
        value: 'https://api.frankfurter.dev/v1/latest'
      - key: ACCESS_TOKEN_TTL
        value: '15m'
      - key: REFRESH_TOKEN_DAYS
        value: '30'
      - key: COOKIE_SECURE
        value: 'true'
      # Pilot seed is opt-in; set ALLOW_PILOT_SEED=true and DEMO_PASSWORD in the dashboard
      # to seed demo users on first startup. Disable immediately after.
      - key: ALLOW_PILOT_SEED
        value: 'false'
      - key: DEMO_PASSWORD
        sync: false

  - type: web
    name: market-lane-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: market-lane-api
          envVarKey: RENDER_EXTERNAL_URL
